# Reference: https://build-cpp.github.io/cmkr/cmake-toml
[project]
name = "Capability Breakpoints"
languages = ["C", "CXX"]
cmake-before = '''
if(POLICY CMP0091)
    cmake_policy(SET CMP0091 NEW)
endif()
# Match the x64dbg PluginTemplate's static-runtime convention (see its
# cmake/msvc-static-runtime.cmake) globally, up front - so engine/ and
# everything it pulls in (including the fetched antlr4 runtime) link
# cleanly into the plugin. Mixing /MT and /MD objects fails at link time.
set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>" CACHE STRING "")
'''
subdirs = ["engine"]

[options]
# Which debugger backend to build - set at configure time, e.g.:
#   cmake -B build -DCAPBP_TARGET_DEBUGGER=x64dbg
CAPBP_TARGET_DEBUGGER = { value = "x64dbg", help = "Debugger backend to build: x64dbg"}

[conditions]
build-x64dbg = 'CAPBP_TARGET_DEBUGGER STREQUAL "x64dbg"'
#build-windbg = 'CAPBP_TARGET_DEBUGGER STREQUAL "windbg"'
#build-ida    = 'CAPBP_TARGET_DEBUGGER STREQUAL "ida"'

# Each backend lives in its own subdirectory and is only entered when
# selected - the add_subdirectory() call for an unselected backend never
# runs, so it's safe for debuggers/windbg and debuggers/ida to not exist yet.

[subdir."debuggers/x64dbg"]
condition = "build-x64dbg"
# NOTE: this subdirectory's own cmake.toml/CMakeLists.txt is maintained by
# its author - nothing here should modify it, only conditionally enter it.

